source: >-
  https://documentation.g2.com/docs/g2-api, https://documentation.g2.com/docs/developer-portal,
  https://documentation.g2.com/docs/g2-mcp-server, https://sell.g2.com/. Replaces
  the 2026-05-04 scaffold, which invented a Free/Professional/Enterprise ladder
  with quota and price numbers G2 has never published.
description: >-
  G2 publishes NO plans, prices, quotas or tiers for its API. There is no public
  pricing page for API access and no self-serve purchase path. Access is a
  function of a G2 vendor subscription plus per-dataset entitlements negotiated
  with G2 sales — G2's own docs say "an active G2 subscription" and "additional
  G2 entitlements may be required for buyer intent data", and route buyers to
  Contact G2 Technical Consulting. The Developer Portal at my.g2.com/developers
  is self-serve for account creation, OAuth app registration and token issuance,
  but the data those tokens can read is set by the subscription, not by a plan a
  developer can choose. Recorded as plan_count 0 — an honest zero, not a gap.
plan_count: 0
plans: []
access_model:
  self_serve_signup: true
  self_serve_signup_url: https://my.g2.com/developers
  self_serve_purchase: false
  public_pricing: false
  sales_gate: true
  sales_contact: https://sell.g2.com/g2-technical-consulting
  entitlement_model: >-
    Per-dataset entitlements attached to a G2 vendor subscription. OAuth app
    permissions and access-token permissions are chosen per endpoint in the
    Developer Portal, but only within what the organization is entitled to.
  free_tier: >-
    One unauthenticated surface exists outside the subscription: the ChatGPT
    plugin OpenAPI at https://www.g2.com/openai.json declares auth type "none"
    and exposes two product/report search operations. G2 does not describe this
    as a plan.
  sandbox: >-
    A no-scope sandbox endpoint (getSandboxBuyerIntentInteractions) is published
    in the OpenAPI, limited to buyer intent data 6-12 months old.
