description: >-
  Binds each published G2 MCP tool to the backing G2 API V2 operation(s), so a
  tool inherits that operation's real parameters and requestBody as its input
  contract. G2's MCP server is a thin agent projection of the same REST core:
  every tool maps cleanly onto a v2 operationId. The REST surface is much wider
  than the tool surface — 61 operations vs 21 tools — so most of G2's API
  (screenshots, badges, features, discussions, downloads, competitors, questions,
  grid reports, G2 Activate, Performance Analytics, Data Subscriptions, Credit
  Account, Product Mappings, Market Signals) has no agent tool at all.
  Confidence is `medium` where the live MCP inputSchema is auth-gated and the
  binding was made by name + semantics rather than by observed schema.
