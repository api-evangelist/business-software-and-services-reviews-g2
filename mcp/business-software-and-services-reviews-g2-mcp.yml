generated: '2026-08-14'
method: searched
status: published
source: https://documentation.g2.com/docs/g2-mcp-server
description: >-
  G2 operates an official remote MCP server at https://mcp.g2.com/mcp,
  authenticated with OAuth 2.0 Authorization Code + PKCE against G2's own
  authorization server (https://www.g2.com/oauth/authorize). It exposes G2 buyer
  intent, competitive intelligence, product catalog, category taxonomy, review
  analytics and research boards to MCP clients. G2 does NOT ship a local stdio
  package — there is no npx/pip install; the only way to reach it is the hosted
  HTTPS endpoint. The tool list below is transcribed verbatim from G2's published
  "Supported MCP tools" table; live tools/list is auth-gated (see x-evidence).
deployment:
  mode: remote
  endpoint: https://mcp.g2.com/mcp
  auth: oauth
  verified: probed
server:
  name: g2-mcp
  transport: http
  url: https://mcp.g2.com/mcp
  auth: oauth2
  protected_resource: well-known/business-software-and-services-reviews-g2-mcp-oauth-protected-resource.json
  authorization_server: https://www.g2.com/
  oauth:
    flow: authorization_code
    pkce: true
    dynamic_client_registration: false
    registration: >-
      Clients must pre-register an OAuth application in the G2 Developer Portal
      (https://my.g2.com/developers) and supply client_id + client_secret. G2's
      authorization server does not support RFC 7591 Dynamic Client Registration.
    deviations:
      - >-
        The authorization callback returns `code` but does NOT return the `state`
        parameter, so standard MCP SDK callback handlers that require `state`
        must be relaxed to require only `code`.
      - >-
        Token validation is performed server-side via G2's introspection endpoint
        using the MCP server's own credentials; a client whose OAuth application
        lacks cross-application token introspection receives 401 after an
        otherwise successful OAuth flow.
    scopes_supported:
      - buyer_intent.read
      - ds_reviews.read
      - g2_activate.read
      - openid
      - products.read
      - products.reviews.read
      - profile
      - research_boards.read
      - research_boards.write
      - vendors.read
entitlement: >-
  An active G2 subscription is required. Access to specific datasets (notably
  Buyer Intent) depends on the account's G2 entitlements.
rate_limits:
  note: >-
    The MCP server calls the underlying G2 API and inherits its limits — 100
    requests per second globally, with a 60-second block on breach.
  detail: rate-limits/business-software-and-services-reviews-g2-rate-limits.yml
partners:
  - name: Claude
    kind: connector
    note: G2 MCP connector, discoverable in Claude's Connectors directory.
  - name: ChatGPT
    kind: connector
    note: G2 MCP app, connected via OAuth from ChatGPT Apps.
  - name: HubSpot
    kind: partner-integration
    note: G2 MCP for HubSpot; read-only access from Breeze Agents. Does not write to HubSpot records.
  - name: Gong
    kind: partner-integration
    note: G2 MCP for Gong; available through Gong AI workflows only.
  - name: AirOps
    kind: partner-integration
    note: G2 MCP for AirOps; available through AirOps Playbooks only.
  - name: Profound
    kind: partner-integration
    note: G2 MCP for Profound; Profound Agents and Ask Profound.
