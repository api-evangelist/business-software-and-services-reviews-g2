    resource_types: [performance_analytics_activation_status, performance_analytics_integration_health, performance_analytics_integration_data_quality, performance_analytics_roi_summary, performance_analytics_roi_trend]
    note: Per-integration ROI and health metrics; one resource type per report shape.
relationships_summary:
  hub: products
  strongest_edges:
    - products -> vendor (belongs_to)
    - products -> categories (has_many)
    - products -> discussions / screenshots / reviews / videos / downloads / snippets / medals (has_many)
    - categories -> parent / children / ancestors / descendants (self-referencing tree)
    - reviews -> user, answers
gaps:
  - >-
    components.schemas contains only four generic envelope schemas; no product,
    review, vendor or category schema is declared. Every concrete shape lives in
    an example, so generated clients get untyped objects.
