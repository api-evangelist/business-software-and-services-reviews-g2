  - name: users
    operations: [getCurrentUser]
  - name: screenshots
    operations: [getScreenshots, getScreenshot, getProductScreenshots]
    relationships:
      - {to: products, kind: belongs_to, via: product}
  - name: product_videos
    operations: [getProductVideos]
    relationships: [{to: products, kind: belongs_to, via: product}]
  - name: video_reviews
    operations: [getProductVideoReviews]
    relationships: [{to: products, kind: belongs_to, via: product}]
  - name: downloads
