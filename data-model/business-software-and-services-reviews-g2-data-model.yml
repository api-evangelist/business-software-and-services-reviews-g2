description: >-
  The G2 API V2 entity graph. G2 is a JSON:API service, so the data model is not
  expressed in components.schemas — the spec declares only four generic schemas
  (cursor_pagination, included, Errors, http_error) and carries the real shapes
  in per-operation examples. This artifact reconstructs the graph from those
  examples. Product is the hub: every content type (reviews, screenshots,
  discussions, videos, downloads, snippets, badges, features) belongs to a
  product, products belong to a vendor and attach to many categories, and the
  category taxonomy is itself a self-referencing tree (parent/children/
  ancestors/descendants). Buyer intent sits apart — it is an analytical
  aggregation keyed by company, not a resource with relationships.
identifiers:
  format: UUID v4
  slug: >-
    products, discussions and categories also carry a human-readable slug, and
    several filters accept "product UUIDs or slugs" interchangeably.
  prefixes: none — G2 does not use typed id prefixes.
traversal:
  include: Related resources are requested with `include` and returned in a top-level included[] array.
  sparse: 'fields[<type>] restricts the attributes returned per resource type.'
entities:
  - name: products
    hub: true
    operations: [getProducts, getProduct, getCurrentUserProducts]
    key_attributes: [name, slug, domain, detail_description, g2_url, image_url, public_detail_url, review_count, star_rating, write_review_url]
    relationships:
      - {to: vendors, kind: belongs_to, via: vendor}
      - {to: product_categories, kind: has_many, via: categories}
      - {to: discussions, kind: has_many, via: discussions}
      - {to: screenshots, kind: has_many, via: screenshots}
  - name: vendors
    operations: [getVendors, getVendor]
    relationships:
      - {to: products, kind: has_many, via: products}
      - {to: products, kind: has_one, via: primary_product}
  - name: categories
    aliases: [product_categories]
    operations: [getCategories, getCategory]
    self_referencing: true
    relationships:
      - {to: categories, kind: belongs_to, via: parent}
      - {to: categories, kind: has_many, via: children}
      - {to: categories, kind: has_many, via: ancestors}
      - {to: categories, kind: has_many, via: descendants}
      - {to: products, kind: has_many, via: products}
  - name: reviews
    operations: [getProductReviews, getCurrentUserProductReview, submitCurrentUserProductReview, getDataSolutionsReviews]
    relationships:
      - {to: products, kind: belongs_to, via: product}
      - {to: users, kind: belongs_to, via: user}
      - {to: answers, kind: has_many, via: answers}
    note: >-
      Two projections exist — the standard JSON:API review resource, and the flat
      enriched Data Solutions projection (separate spec, ds_reviews.read scope).
  - name: answers
    note: Question responses attached to a review; the survey payload of a G2 review.
    relationships:
      - {to: reviews, kind: belongs_to, via: review}
  - name: discussions
    operations: [getProductDiscussions]
    relationships:
