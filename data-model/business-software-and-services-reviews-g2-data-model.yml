      - {to: categories, kind: belongs_to, via: category}
  - name: buyer_intent
    analytical: true
    operations: [getGlobalBuyerIntentInteractions, getBuyerIntentInteractions, getSandboxBuyerIntentInteractions]
    query_model: >-
      OLAP-style — dimensions (company_name, company_domain, day),
      measures (total_activity, visitor_count, company_intent_score) and
