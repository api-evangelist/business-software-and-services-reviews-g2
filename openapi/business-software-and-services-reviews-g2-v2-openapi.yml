      tags:
      - Users
      description: Returns the currently authenticated user.
      security:
      - G2OAuth:
        - openid
        - profile
      parameters:
      - name: fields[users]
        in: query
        explode: false
        description: Comma separated list of fields for users to include in response
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - email
            - image_url
      responses:
        '401':
          description: Unauthenticated
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
