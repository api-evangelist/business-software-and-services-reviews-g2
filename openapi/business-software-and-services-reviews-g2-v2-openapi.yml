  "/api/v2/market_signals":
    get:
      summary: Retrieve buyer intent signals for a date range
      operationId: getMarketSignalsIndex
      tags:
      - Market Signals
      description: |
        **Requires `market_signals.read` scope.**

        Retrieve buyer intent signals (interactions) for specific categories.

        Returns one result per buyer intent interaction within the specified date range.
        Each interaction includes the category UUID, company name, and domain.

        If no dates are provided, defaults to today for both start and end date.

        Results are paginated using cursor-based pagination (default 25, max 250 per page).
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: category_ids[]
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
        description: List of category UUIDs or slugs
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Start date of range to check for signals (YYYY-MM-DD). Defaults
          to today.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: End date of range to check for signals (YYYY-MM-DD). Defaults
          to today.
      - name: page[size]
        in: query
        required: false
        description: 'Number of records per page (default: 25, max: 250)'
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 25
      - name: page[after]
        in: query
        required: false
        description: Cursor for fetching the next page of results
        schema:
          type: string
      - name: page[before]
        in: query
        required: false
        description: Cursor for fetching the previous page of results
        schema:
          type: string
      responses:
        '200':
          description: Signals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - market_signals
                        attributes:
                          type: object
                          properties:
                            category_uuid:
                              type: string
                            company_name:
                              type: string
                            company_domain:
                              type: string
                            start_date:
                              type: string
                              format: date
                            end_date:
                              type: string
                              format: date
                          required:
                          - category_uuid
                          - company_name
                          - company_domain
                          - start_date
                          - end_date
                      required:
                      - type
                      - attributes
                required:
                - data
        '400':
          description: Invalid parameters
        '404':
          description: Category not found
