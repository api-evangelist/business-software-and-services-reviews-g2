        example: '2024'
        in: query
        schema:
          type: string
      - name: filter[category_id]
        description: Category UUID to filter medals by category
        in: query
        schema:
          type: string
      - name: fields[medals]
        in: query
        explode: false
        description: Comma separated list of fields for medals to include in response
        schema:
          type: array
          items:
            type: string
            enum:
            - title
            - description
            - badge_type
            - image
            - alt_text
            - segment
            - full_title
            - geo_name
      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. product,categories)
        schema:
          type: array
          items:
            type: string
            enum:
            - product
            - categories
