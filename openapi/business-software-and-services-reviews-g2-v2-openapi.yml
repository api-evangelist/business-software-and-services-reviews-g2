          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
              schema:
                "$ref": "#/components/schemas/Errors"
        '403':
          description: Missing performance_analytics.read scope
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '403'
                  title: You do not have access to that resource
              schema:
                "$ref": "#/components/schemas/Errors"
        '404':
          description: With invalid product id
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  title: Not Found
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/v2/products/{product_id}/performance_analytics/integrations/{integration_type}/roi_summary":
    get:
      summary: Show ROI summary
      operationId: getPerformanceAnalyticsRoiSummary
      tags:
      - Performance Analytics
      description: |
        **Requires `performance_analytics.read` scope.**

        Summarize G2-influenced ROI tiles for one CRM integration over a date window.
      security:
      - G2OAuth:
        - performance_analytics.read
      parameters:
      - name: product_id
        in: path
        description: The UUID or slug of the product
        required: true
        schema:
          type: string
      - name: integration_type
        in: path
        schema:
          type: string
          enum:
          - hubspot
          - salesforce
        description: The CRM provider
        required: true
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Window start (ISO8601 date); defaults to a trailing 12 months
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Window end (ISO8601 date); defaults to today
      responses:
        '200':
          description: ROI summary
          content:
            application/vnd.api+json:
              example:
                data:
                  id: 4e5f1e9c-4597-4e3b-8a72-000000000001-hubspot
                  type: performance_analytics_roi_summary
                  attributes:
                    provider: hubspot
                    status: connected
                    date_from: '2021-01-01'
                    date_to: '2022-01-01'
                    currency: USD
                    base:
                      g2_influenced_pipeline: 400000.0
                      g2_influenced_closed_won: 100000.0
                      non_influenced_pipeline: 100000.0
                      deals_total_count: 20
                      deals_influenced_count: 4
                      deals_influenced_closed_won_count: 3
                      deals_non_influenced_count: 16
                      avg_deal_size: 100000.0
                      influenced_close_rate: 0.25
                      influenced_sales_cycle_length: 94
                      attribution_rate: 80.0
                      uplift_pct: 100.0
                    high_intent:
                      status: not_available
                      high_intent_pipeline:
                      high_intent_closed_won:
                      deals_high_intent_count:
                      deals_high_intent_closed_won_count:
                      non_influenced_closed_won:
                    created:
                      status: available
                      g2_created_pipeline: 55000.0
                      deals_created_count: 2
                      deals_created_closed_won_count: 1
                    attribution_window:
                      influence_analyzer_days: 180
                      deal_calculation_days: 90
                    last_synced_at:
                    connect_url:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          provider:
                            type: string
                            description: The CRM provider this ROI summary describes
                            example: hubspot
                            nullable: false
                          status:
                            type: string
                            description: connected (real data) or not_connected (provider
                              not active+authenticated; the metric groups are null
                              — never sample data)
                            example: connected
                            nullable: false
                          date_from:
                            type: string
                            description: Resolved window start (ISO8601 date)
                            example: '2025-07-08'
                            format: date
                            nullable: false
                          date_to:
                            type: string
                            description: Resolved window end (ISO8601 date)
                            example: '2026-07-08'
                            format: date
                            nullable: false
                          currency:
                            type: string
                            description: Currency of all money tiles (pinned; the
                              data layer stores amount_in_usd)
                            example: USD
                            nullable: false
                          base:
                            type: object
                            description: 'Always-present tiles: influenced/non-influenced
                              pipeline & counts plus derived ratios. Null only when
                              status is not_connected.'
                            example:
                              g2_influenced_pipeline: 405000.0
                              g2_influenced_closed_won: 98000.0
                              non_influenced_pipeline: 500500.0
                              deals_total_count: 10739
                              deals_influenced_count: 42
                              deals_influenced_closed_won_count: 346
                              deals_non_influenced_count: 7982
                              avg_deal_size: 9642.85
                              influenced_close_rate: 0.17
                              influenced_sales_cycle_length: 94
                              attribution_rate: 44.73
                              uplift_pct: 34.85
                            properties: {}
                            nullable: true
                          high_intent:
                            type: object
                            description: 'Directly-influenced (High-Intent) tiles
                              with a status: available on the preview/Salesforce path,
                              not_available where the read path omits them (never
                              a Buyer Intent upsell). Tiles are null when not available.'
                            example:
                              status: available
                              high_intent_pipeline: 120000.0
                              high_intent_closed_won: 185000.0
                              deals_high_intent_count: 2524
                              deals_high_intent_closed_won_count: 313
                              non_influenced_closed_won: 210000.0
                            properties: {}
                            nullable: true
                          created:
                            type: object
                            description: 'G2-created/sourced tiles with a status:
                              available (Buyer Intent + HubSpot), requires_upgrade
                              (non-BI vendor — carries an {message, upgrade_url} prompt),
                              or not_available (Salesforce has no sourced concept).
                              Tiles null unless available.'
                            example:
                              status: requires_upgrade
                              g2_created_pipeline:
                              deals_created_count:
                              deals_created_closed_won_count:
                              upgrade:
                                message: Upgrade to G2 Buyer Intent…
                                upgrade_url: https://…
                            properties: {}
                            nullable: true
                          attribution_window:
                            type: object
                            description: 'Per-engine attribution windows in days (HubSpot
                              runs two engines: 180-day InfluenceAnalyzer and 90-day
                              DealCalculation; Salesforce: 180 only)'
                            example:
                              influence_analyzer_days: 180
                              deal_calculation_days: 90
                            properties: {}
                            nullable: true
                          last_synced_at:
                            type: string
                            description: ISO8601 timestamp of the last successful
                              sync, or null if never synced
                            example: '2026-07-05T01:57:47-05:00'
                            format: date-time
                            nullable: true
                          connect_url:
                            type: string
                            description: Link into the connection flow (present when
                              status is not_connected)
                            example: https://my.g2.com/example-product/integrations
                            nullable: true
                      relationships:
                        type: object
                  included:
                    "$ref": "#/components/schemas/included"
        '400':
          description: When date_from is after date_to
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: 'date_from: must be before or equal to date_to'
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: Unauthenticated
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
              schema:
                "$ref": "#/components/schemas/Errors"
        '403':
          description: Missing performance_analytics.read scope
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '403'
                  title: You do not have access to that resource
              schema:
                "$ref": "#/components/schemas/Errors"
        '404':
          description: With invalid product id
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  title: Not Found
              schema:
                "$ref": "#/components/schemas/Errors"
