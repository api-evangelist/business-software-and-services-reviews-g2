  "/api/v2/products/{product_id}/g2_activate/industry_search":
    post:
      summary: Match a free-text business description to NAICS industry names
      operationId: createG2ActivateIndustrySearch
      tags:
      - G2 Activate
      description: "**Requires `g2_activate.read` scope.**\n"
      security:
      - AccountAPIToken: []
        G2OAuth:
        - g2_activate.read
      parameters:
      - name: product_id
        in: path
        description: Product UUID or Slug
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Unauthenticated
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
              schema:
                "$ref": "#/components/schemas/Errors"
        '404':
          description: With unknown product id
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  title: Not Found
              schema:
                "$ref": "#/components/schemas/Errors"
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/Errors"
              examples:
                when missing g2_activate.read scope:
                  value:
                    errors:
                    - status: '403'
                      title: You do not have access to that resource
                when actor lacks intent_driven_leads component on product:
                  value:
                    errors:
                    - status: '403'
                      title: You do not have access to that resource
              example:
                errors:
                - status: '403'
                  title: You do not have access to that resource
        '400':
          description: With too-short query
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: 'query: size cannot be less than 2'
              schema:
                "$ref": "#/components/schemas/Errors"
        '200':
          description: Returns matched industries
          content:
            application/vnd.api+json:
              example:
                data:
                - id: Payroll Services
                  type: industry_matches
                  attributes:
                    industry: Payroll Services
                    industry_group: Accounting, Tax Preparation, Bookkeeping, and
                      Payroll Services
                    sector: Professional, Scientific, and Technical Services
                    confidence: 90
                - id: Tax Preparation Services
                  type: industry_matches
                  attributes:
                    industry: Tax Preparation Services
                    industry_group: Accounting, Tax Preparation, Bookkeeping, and
                      Payroll Services
                    sector: Professional, Scientific, and Technical Services
                    confidence: 85
        '503':
          description: LLM or embedding backend failure
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '503'
                  title: AI industry matcher is temporarily unavailable. Retry with
                    backoff.
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 500
                  description: Free-text business description to match against NAICS
                    industries
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  description: Maximum matches to return (default 8)
