  "/api/v2/products/{product_id}/badges":
    get:
      summary: Lists medals (badges) awarded to given product
      operationId: getProductMedals
      tags:
      - Medals
      description: |+
        **No scope required.**


      security:
      - AccountAPIToken: []
      parameters:
      - name: product_id
        in: path
        description: Product UUID or Slug
        required: true
        schema:
          type: string
      - name: page[number]
        in: query
        schema:
          type: integer
        description: Page number to return (min 1). Defaults to 1.
      - name: page[size]
        in: query
