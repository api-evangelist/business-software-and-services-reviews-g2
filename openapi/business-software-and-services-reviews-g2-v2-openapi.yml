  "/api/v2/products/{product_id}/reviews":
    get:
      summary: Lists reviews of given product
      operationId: getProductReviews
      tags:
      - Reviews
      description: |
        **Requires `products.reviews.read` scope.**

        For filters that require integer IDs, the appropriate IDs are available in the meta aggregates of this endpoint.
        Suggestion: Query reviews for your product and then use filtering based on data returned to narrow results.
      security:
      - AccountAPIToken: []
      parameters:
      - name: page[size]
        in: query
        required: false
        description: 'Number of records per page (default: 25, max: 250)'
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 25
      - name: page[after]
        in: query
        required: false
        description: Cursor for fetching the next page of results
        schema:
          type: string
      - name: page[before]
        in: query
        required: false
        description: Cursor for fetching the previous page of results
        schema:
          type: string
      - name: product_id
        in: path
        description: Product UUID or Slug
        required: true
        schema:
          type: string
      - name: filter[updated_at_gt]
        description: Filter records updated after this date
        schema:
          type: string
          format: date-time
        in: query
      - name: filter[updated_at_lt]
        description: Filter records updated before this date
        schema:
          type: string
          format: date-time
        in: query
      - name: filter[category_ids][]
        description: Filter reviews by category IDs
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[comment_answer_values_exclude]
        description: Exclude reviews with specific comment answer values
        in: query
        schema:
          type: string
      - name: filter[company_segment][]
        description: |+
          Filter by company size segment

           - Company Segment ID: `179` => `Small-Business` *(0-50 employees)*

           - Company Segment ID: `180` => `Mid-Market` *(51-1000 employees)*

           - Company Segment ID: `181` => `Enterprise` *(1001-Infinity employees)*

        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[country][]
        description: Filter by country names
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[industry][]
        description: Filter by industry IDs
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[nps_score][]
        description: Filter by NPS scores (0-10)
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[region][]
        description: Filter by geographic regions
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[role][]
        description: Filter by user role IDs
        in: query
        schema:
          type: array
          items:
            type: string
      - name: filter[removed]
        description: Filter to show only removed reviews
        in: query
        schema:
          type: string
      - name: serializer
        in: query
        type: string
        required: false
        description: Serializer type (market_intelligence or default)
        schema:
          enum:
          - market_intelligence
      - name: fields[reviews]
        in: query
        description: |-
          Comma-separated list of fields to include. Available fields vary based on context:

          - Default (standard serializer): answers, attribution, comments_present, country_name, default_sort, is_public,
                     official_response_present, percent_complete, product_name, published_at, regions, review_incentive, slug,
                     source, star_rating, submitted_at, title, url, user_updated_at, verified_current_user.

          - With serializer=market_intelligence: answers, category_names, company_segment_name, country_code, country_name,
                     feature_ratings, industry_name, primary_region_name, product_name, rating, switched_from_products,
                     switched_theme, title, url, user_company_name, user_updated_at.

          - With filter[removed]=true: product_name, removed_at, slug, submitted_at
        schema:
          oneOf:
          - type: array
            items:
              type: string
              enum:
              - answers
              - attribution
              - comments_present
              - country_name
              - default_sort
              - is_public
              - official_response_present
              - percent_complete
              - product_name
              - published_at
              - regions
              - review_incentive
              - slug
              - source
              - star_rating
              - submitted_at
              - title
              - url
              - user_updated_at
              - verified_current_user
            title: Standard serializer fields
          - type: array
            items:
              type: string
              enum:
              - answers
              - category_names
              - company_segment_name
              - country_code
              - country_name
              - feature_ratings
              - industry_name
              - primary_region_name
              - product_name
              - rating
              - switched_from_products
              - switched_theme
              - title
              - url
              - user_company_name
              - user_updated_at
            title: Market intelligence serializer fields
          - type: array
            items:
              type: string
              enum:
              - product_name
              - removed_at
              - slug
              - submitted_at
            title: Removed reviews fields
        explode: false
      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. user)
        schema:
          type: array
          items:
            type: string
            enum:
            - user
      responses:
        '400':
          description: with invalid request parameters
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: 'Invalid parameter: "include"             contains unknown
                    items: "foo"'
              schema:
                "$ref": "#/components/schemas/Errors"
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/Errors"
              examples:
                when user does not have access to the product:
                  value:
                    errors:
                    - status: '403'
                      title: You do not have access to that resource
                when user has product access but lacks the required license:
                  value:
                    errors:
                    - status: '403'
                      title: Your current plan does not provide access to this resource.
                        To unlock it, explore your upgrade options. Talk to G2 at
                        the link below
                      links:
                        type:
                        - https://sell.g2.com/strategy-session-with-customers?utm_source=g2&utm_medium=product&utm_campaign=g2-mcp-demo-request&utm_content=none&utm_term=none
