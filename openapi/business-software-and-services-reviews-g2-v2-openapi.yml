  "/api/v2/reports/grid/{product_id}":
    get:
      summary: Get grid reports for a product
      operationId: getGridReports
      tags:
      - Reports
      description: "**Requires `reports.read` scope.**\n"
      security:
      - AccountAPIToken:
        - reports.read
      parameters:
      - name: product_id
        in: path
        description: Product UUID or slug
        required: true
        schema:
          type: string
      - name: filter[category_id]
        description: Filter by category UUID or slug
        in: query
        schema:
          type: string
      - name: filter[quarter]
        description: Report quarter in YYYY-QN format (e.g., 2025-Q4). Defaults to
          most recent published quarter.
        example: 2025-Q4
        in: query
        schema:
          type: string
      - name: fields[grid_reports]
        in: query
        explode: false
        description: Comma separated list of fields for grid_reports to include in
          response
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - name
            - slug
            - category_name
            - category_id
            - quarter
            - segment
            - grid_position
            - satisfaction_score
            - market_presence_score
            - badge_url
      responses:
        '200':
          description: Successful responses
          content:
            application/vnd.api+json:
              examples:
                Grid report data for product:
                  value:
                    data:
                    - id: aaaaaaaa-bbbb-4ccc-8ddd-000000000005
                      type: grid_reports
                      attributes:
                        name: test product 265
                        slug: test-product-265
                        category_name: Test Category
                        category_id: aaaaaaaa-bbbb-4ccc-8ddd-000000000001
                        quarter: Q4 2024
                        segment:
                        grid_position: Leader
                        satisfaction_score: 85.5
                        market_presence_score: 72.3
                        badge_url:
                    meta:
                      total: 1
                      quarter: Q4 2024
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Product UUID
                              example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                              nullable: false
                            name:
                              type: string
                              description: Product name
                              example: Acme Software
                              nullable: false
                            slug:
                              type: string
                              description: Product slug
                              example: acme-software
                              nullable: false
                            category_name:
                              type: string
                              description: Category name
                              nullable: true
                            category_id:
                              type: string
                              description: Category UUID
                              example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                              nullable: true
                            quarter:
                              type: string
                              description: Report quarter in QN YYYY format
                              example: Q1 2026
                              nullable: true
                            segment:
                              type: string
                              description: Report segment
                              example: Small Business
                              nullable: true
                            grid_position:
                              type: string
                              description: Product grid position
                              example: Leader
                              nullable: true
                            satisfaction_score:
                              type: number
                              description: Product satisfaction score out of 100
                              example: 95.9
                              nullable: true
                            market_presence_score:
                              type: number
                              description: Product market presence score out of 100
                              example: 86.1
                              nullable: true
                            badge_url:
                              type: string
                              description: Product badge URL
                              nullable: true
                        relationships:
                          type: object
                  meta:
                    type: object
                    required:
                    - total
                    - quarter
                    properties:
                      total:
                        type: integer
                        description: Total number of reports returned
                      quarter:
                        type: string
                        description: Report quarter label (e.g., Q4 2025)
                        nullable: true
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
