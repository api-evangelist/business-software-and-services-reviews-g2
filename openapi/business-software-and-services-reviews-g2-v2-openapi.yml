  "/api/v2/products/{product_id}/performance_analytics/integrations/{integration_type}/data_quality":
    get:
      summary: Show CRM data quality
      operationId: getPerformanceAnalyticsDataQuality
      tags:
      - Performance Analytics
      description: |
        **Requires `performance_analytics.read` scope.**

        Report data-quality counts (missing currency, hidden outliers, duplicates) for one CRM integration.
      security:
      - G2OAuth:
        - performance_analytics.read
      parameters:
      - name: product_id
        in: path
        description: The UUID or slug of the product
        required: true
        schema:
          type: string
      - name: integration_type
        in: path
        schema:
          type: string
          enum:
          - hubspot
          - salesforce
        description: The CRM provider
        required: true
      responses:
        '200':
          description: Data quality
          content:
            application/vnd.api+json:
              example:
                data:
                  id: f8769005-4794-4db3-8592-000000000001-hubspot
                  type: performance_analytics_integration_data_quality
                  attributes:
                    provider: hubspot
                    active_authenticated: false
                    missing_currency_count: 2
                    outliers_hidden_count: 1
                    duplicate_deals_count: 1
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          provider:
                            type: string
                            description: The CRM provider this data-quality block
                              describes
                            example: hubspot
                            nullable: false
                          active_authenticated:
                            type: boolean
                            description: Whether the integration is currently live
                              and authenticated. When false, the counts describe stale
                              synced rows from a disconnected integration
                            example: true
                            nullable: false
                          missing_currency_count:
                            type: integer
                            description: Synced deal rows with no currency on the
                              CRM payload, so their amount could not be reliably converted
                              to USD
                            example: 12
                            nullable: false
                          outliers_hidden_count:
                            type: integer
                            description: Deal rows auto-archived as outliers (excluded
                              from ROI math) that the vendor has not confirmed or
                              restored
                            example: 3
                            nullable: false
                          duplicate_deals_count:
                            type: integer
                            description: Active synced rows beyond distinct CRM deal
                              ids — the surplus from the same deal syncing more than
                              once. > 0 means the ROI totals may be inflated
                            example: 11217
                            nullable: false
                      relationships:
                        type: object
                  included:
                    "$ref": "#/components/schemas/included"
        '400':
          description: When the provider is unsupported
