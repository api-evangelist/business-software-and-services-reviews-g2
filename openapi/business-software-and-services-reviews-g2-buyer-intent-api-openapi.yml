              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            company_id:
                              type: string
                              description: Unique company identifier
                            company_name:
                              type: string
                              description: Company name
                            company_domain:
                              type: string
                              description: Company website domain
                            company_state:
                              type: string
                              description: Company location state
                            visitor_id:
                              type: string
                              description: Unique visitor identifier
                            company_intent_score:
                              type: number
                              description: Intent score (0-100)
                            total_activity:
                              type: integer
                              description: Total page views and interactions
                            day:
                              type: string
                              format: date
                              description: Date for time-series data
                            product_id:
                              type:
                              - string
                              - 'null'
                              description: Product UUID
                            category_id:
                              type:
                              - string
                              - 'null'
                              description: Category UUID
                            subject_product_id:
                              type: string
                              description: Subject product UUID
                            subject_product_slug:
                              type: string
                              description: Subject product slug
                      required:
                      - id
                      - type
                      - attributes
                  included:
                    $ref: '#/components/schemas/included'
                  links:
                    $ref: '#/components/schemas/cursor_pagination'
components:
  schemas:
    included:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          type:
            type: string
          attributes:
            type: object
          relationships:
            type: object
    cursor_pagination:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
        self:
          type:
          - string
          - 'null'
  securitySchemes:
    AccountAPIToken:
      type: http
      scheme: bearer
    G2OAuth:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://www.g2.com/oauth/token
          authorizationUrl: https://www.g2.com/oauth/authorize
          scopes:
            openid: OpenID Connect default scope
            profile: Profile information on current user
            data_subscriptions.read: Read Data Subscription records
            data_subscriptions.read_write: Modify Data Subscription records
            partner:partner-id.read: Access records created in Partner realm
            performance_analytics.read: Read Performance Analytics data
