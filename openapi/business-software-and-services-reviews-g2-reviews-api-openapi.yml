  /api/v2/users/me/products/{product_id}/review:
    get:
      summary: Show review for a product
      operationId: getCurrentUserProductReview
      tags:
      - Reviews
      description: '**⚠️ G2 is currently restricting access to this endpoint.**

        This endpoint retrieves the review for a specific product owned by the current user.

        '
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
      - name: fields[reviews]
        in: query
        explode: false
        description: Comma separated list of fields for reviews to include in response
        schema:
          type: array
          items:
            type: string
            enum:
            - questions
            - published_at
            - submitted_at
            - user_updated_at
            - url
      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. user,answers)
        schema:
          type: array
          items:
            type: string
            enum:
            - user
            - answers
      responses:
        '401':
          description: Unauthenticated
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: Not Authorized
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '403'
                  title: You do not have access to that resource
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Review not found
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '404'
                  title: Not Found
              schema:
                $ref: '#/components/schemas/Errors'
        '200':
          description: Successful retrieval of review
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            placeholder:
                              type:
                              - string
                              - 'null'
                            is_required:
                              type: boolean
                            question_type:
                              type: string
                            format:
                              type:
                              - string
                              - 'null'
                            min:
                              type:
                              - number
                              - 'null'
                            max:
                              type:
                              - number
                              - 'null'
                            choices:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  value:
                                    type: string
                      url:
                        type:
                        - string
                        - 'null'
                      submitted_at:
                        type: string
                      published_at:
                        type: string
                      user_updated_at:
                        type: string
                  included:
                    type: array
                    items:
                      type: object
