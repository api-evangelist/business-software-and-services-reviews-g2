      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. categories,discussions,screenshots,vendor)
        schema:
          type: array
          items:
            type: string
            enum:
            - categories
            - discussions
            - screenshots
            - vendor
      - name: product_id
        in: path
        description: The UUID or slug of the product
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful responses
          content:
            application/vnd.api+json:
