  /api/v2/users/me/products:
    get:
      summary: List all products owned by current account
      operationId: getCurrentUserProducts
      tags:
      - Products
      description: '**⚠️ G2 is currently restricting access to this endpoint.**

        This endpoint shows subscription-specific product information, of

        products that the current account has ownership of.

        '
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: page[size]
        in: query
        required: false
        description: 'Number of records per page (default: 25, max: 250)'
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 25
      - name: page[after]
        in: query
        required: false
        description: Cursor for fetching the next page of results
        schema:
          type: string
      - name: page[before]
        in: query
        required: false
        description: Cursor for fetching the previous page of results
        schema:
          type: string
      - name: fields[products]
        in: query
        explode: false
        description: Comma separated list of fields for products to include in response
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - domain
            - slug
            - image_url
      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. categories,subscribed_categories)
        schema:
          type: array
          items:
            type: string
            enum:
            - categories
            - subscribed_categories
      - name: filter[product_id][]
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: Filter by one or more product UUIDs
        example:
        - a1b2c3d4-e5f6-7890-abcd-ef1234567890
      - name: filter[slug][]
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: Filter by one or more product slugs
        example:
        - salesforce-sales-cloud
        - hubspot-crm
      responses:
        '401':
          description: Unauthenticated
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
              schema:
                $ref: '#/components/schemas/Errors'
        '400':
          description: with invalid request parameters
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: 'Invalid parameter: "include"             contains unknown items: "foo"'
              schema:
                $ref: '#/components/schemas/Errors'
        '200':
          description: With all fields and relationships
          content:
            application/vnd.api+json:
              example:
                data:
                - id: ee3d9e4d-55e2-427c-8f24-000000000004
                  type: products
                  attributes:
                    name: test product 340
                    domain: example.com
                    slug: test-product-340
                    image_url: null
                  relationships:
                    categories:
                      data:
                      - id: aaaaaaaa-bbbb-4ccc-8ddd-000000000008
                        type: product_categories
                    subscribed_categories:
                      data:
                      - id: ee3d9e4d-55e2-427c-8f24-000000000003
                        type: product_categories
                included:
                - id: aaaaaaaa-bbbb-4ccc-8ddd-000000000008
                  type: product_categories
                  attributes:
                    name: test
                    slug: test
                    description: test
                    updated_at: '2022-01-01T00:00:00.000-06:00'
                - id: ee3d9e4d-55e2-427c-8f24-000000000003
                  type: product_categories
                  attributes:
                    name: Subscribed Category
                    slug: subscribed-category
                    description: test
                    updated_at: '2022-01-01T00:00:00.000-06:00'
                links:
                  self: http://data.example.com/api/v2/users/me/products?fields%5Bproducts%5D=name,domain,slug,image_url&include=categories,subscribed_categories&&
                  next: null
                  prev: null
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                            domain:
                              type: string
                            slug:
                              type: string
                            image_url:
                              type:
                              - string
                              - 'null'
                        relationships:
                          type: object
                      required:
                      - id
                      - type
                      - attributes
                  included:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            uuid:
                              type: string
                            name:
                              type: string
                            slug:
                              type: string
                            description:
                              type:
                              - string
                              - 'null'
                            updated_at:
                              type: string
                  links:
