                            description: Vendor website URL for the product
                            example: https://www.salesforce.com
                            format: uri
                          review_count:
                            type: integer
                            description: Total number of reviews for the product
                            example: 15234
                          slug:
                            type: string
                            description: URL-friendly identifier for the product
                            example: salesforce-sales-cloud
                          write_review_url:
                            type: string
                            description: URL to write a review for this product on G2
                            format: uri
                          image_url:
                            type:
                            - string
                            - 'null'
                            description: URL to the product logo or favicon
                            format: uri
                          pricing_tiers:
                            type: array
                            items:
                              type: string
                              x-nullable: false
                            description: List of pricing tiers with prices
                            example:
                            - Free
                            - Pro ($7.25 per user Per Month)
                            - Enterprise (Contact Us)
                          star_rating:
                            type:
                            - number
                            - 'null'
                            description: Average star rating (1-5 scale)
                            example: 4.3
                      relationships:
                        type: object
                  included:
                    $ref: '#/components/schemas/included'
