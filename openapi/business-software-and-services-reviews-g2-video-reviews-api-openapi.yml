                    name: Test Vendor
                    description: null
                    company_website: https://example.com
                    slug: test-vendor
                    public_products_count: 1
                    updated_at: '2022-01-01T00:00:00.000-06:00'
                  relationships:
                    products:
                      data:
                      - id: ba369f74-e278-485d-8e39-000000000001
                        type: products
                links:
                  self: http://data.example.com/api/v2/products/ba369f74-e278-485d-8e39-000000000001/video_reviews?filter%5Bupdated_at_gt%5D=&filter%5Bupdated_at_lt%5D=&filter%5Bcreated_at_gt%5D=&filter%5Bcreated_at_lt%5D=&fields%5Bvideo_reviews%5D=product_id,url,created_at,updated_at,file_name,title,description,thumbnail_url,video_type,video_id,video_provider,video_transcript_text&include=product,vendor
                  next: null
                  prev: null
                meta:
                  record_count: 3
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            product_id:
                              type: string
                              description: UUID of the product this video review belongs to
                            url:
                              type: string
                              description: Embed URL for the video
                              format: uri
                            created_at:
                              type: string
                              description: Timestamp when the video review was created
                              format: date-time
                            updated_at:
                              type: string
                              description: Timestamp when the video review was last updated
                              format: date-time
                            file_name:
                              type: string
                              description: File name identifier for the video
                            title:
                              type:
                              - string
                              - 'null'
                              description: Title of the video review
                            description:
                              type:
                              - string
                              - 'null'
                              description: Description of the video review
                            thumbnail_url:
                              type: string
                              description: URL for the video thumbnail image
                              format: uri
                            video_type:
                              type: string
                              description: Type of video (e.g. video_review)
                            video_id:
                              type: string
                              description: Provider-specific video identifier
                            video_provider:
                              type: string
                              description: Video hosting provider name
                            video_transcript_text:
                              type:
                              - string
                              - 'null'
                              description: Transcript text of the video
                        relationships:
                          type: object
                      required:
                      - id
                      - type
                      - attributes
                  included:
                    $ref: '#/components/schemas/included'
                  links:
                    $ref: '#/components/schemas/cursor_pagination'
components:
  schemas:
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              title:
                type: string
              links:
                type:
                - object
                - 'null'
              source:
                type:
                - object
                - 'null'
    cursor_pagination:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
        self:
          type:
          - string
          - 'null'
    included:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          type:
            type: string
          attributes:
            type: object
          relationships:
            type: object
  securitySchemes:
    AccountAPIToken:
      type: http
      scheme: bearer
    G2OAuth:
      type: oauth2
      flows:
        authorizationCode:
          tokenUrl: https://www.g2.com/oauth/token
          authorizationUrl: https://www.g2.com/oauth/authorize
          scopes:
            openid: OpenID Connect default scope
            profile: Profile information on current user
            data_subscriptions.read: Read Data Subscription records
            data_subscriptions.read_write: Modify Data Subscription records
            partner:partner-id.read: Access records created in Partner realm
            performance_analytics.read: Read Performance Analytics data
