        type: OAuthScopes
    description: >-
      The G2 MCP (Model Context Protocol) Server enables AI assistants like
      Claude to access G2 data. Uses OAuth for authentication via browser
      sign-in. Provides access to buyer intent intelligence, competitive
      intelligence, and review analytics within AI workflows.
    features:
      - OAuth Authentication
      - Buyer Intent Intelligence
      - Competitive Intelligence
      - Review Analytics
      - AI Integration Support
    useCases:
      - AI-powered sales intelligence
      - Automated competitive research in AI workflows
      - LLM-powered buyer intent analysis
  - aid: >-
      business-software-and-services-reviews-g2:g2-data-solutions-api
    name: G2 Data Solutions API
    tags:
      - B2B
      - Software Reviews
      - Data Enrichment
      - Market Intelligence
    humanURL: https://data.g2.com/api/v2/docs/index.html
    baseURL: https://data.g2.com/api/v2/
    properties:
      - url: https://data.g2.com/api/v2/docs/index.html
        type: Documentation
      - url: https://data.g2.com/api/v2/docs/index.html
        type: APIReference
      - url: openapi/business-software-and-services-reviews-g2-data-solutions-openapi.yml
        type: OpenAPI
      - url: overlays/business-software-and-services-reviews-g2-data-solutions-overlay.yaml
        type: Overlay
      - url: authentication/business-software-and-services-reviews-g2-authentication.yml
        type: Authentication
      - url: scopes/business-software-and-services-reviews-g2-scopes.yml
        type: OAuthScopes
    description: >-
      The G2 Data Solutions API delivers enriched review data with flat attribute
      structures, intended for analytics and warehouse workflows rather than
      profile rendering. It returns reviews with B2B firmographic context —
      company segment, industry and competitive switching signal — attached to
      each record, and is the surface behind the MCP tool
      list_market_intelligence_product_reviews. G2 marks it a BETA API and warns
      the definition may change before official release. Requires the
      ds_reviews.read OAuth scope; cursor paginated with page[size] up to 250.
    features:
      - Flat enriched review attributes
      - B2B firmographic context per review
      - Cursor pagination up to 250 records per page
      - Updated-at and created-at range filters
      - Product UUID or slug filtering
      - JSON:API response envelope
    useCases:
      - Warehouse and BI ingestion of G2 review data
      - Sentiment and competitive switching analysis
      - Market intelligence reporting
      - Customer voice enrichment for AI workflows
