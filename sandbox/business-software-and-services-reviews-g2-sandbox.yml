description: >-
  G2 does not run a separate sandbox environment and publishes no test keys, test
  cards or fixture tooling. What it does publish is a single sandbox ENDPOINT on
  the production host that requires no OAuth scope, so a developer can exercise
  the buyer intent query language before their organization is entitled to live
  intent data. Interactive try-it-out against production runs in the Swagger UI
  with a real Developer Portal token.
test_live_separation:
  separate_environment: false
  separate_host: false
  key_prefixes: null
  note: >-
    One set of credentials, one host (data.g2.com). Isolation is per-endpoint,
    not per-environment.
sandbox_endpoints:
  - operationId: getSandboxBuyerIntentInteractions
    method: GET
    path: /api/sandbox/products/{subject_product_id}/buyer_intent
    scope_required: none
    published_note: >-
      "No scope is required to access this sandbox endpoint" and
      "Sandbox API: This endpoint is a sandbox endpoint and is data limited. Only
      data between 6 months to 1 year ago will be available."
    data_window: 6 to 12 months in the past
    live_twin: getBuyerIntentInteractions
    purpose: >-
      Exercise the OLAP query interface — dimensions, measures, dimension_filters
      with _eq/_cont/_gt/_present operators, sort, and time-series vs aggregated
      shapes — against real but aged data.
