      code_challenge_methods_supported ["plain","S256"] in the discovery
      document; the MCP integration guide requires Authorization Code with PKCE.
  - id: oidc
    conforms: true
    evidence: >-
      /.well-known/openid-configuration on www.g2.com with issuer, userinfo,
