description: >-
  Which cross-cutting standards the G2 API actually conforms to, judged from the
  published contract and discovery documents rather than from marketing claims.
  G2's strongest conformance is on the identity side — a complete OIDC discovery
  document, OAuth 2.0 authorization-code with PKCE, and RFC 9728 protected-resource
  metadata for its MCP server. Its weakest is error semantics: JSON:API errors
  with no machine-readable codes and no RFC 9457.
standards:
  - id: openapi-3.0
    conforms: true
    evidence: >-
      Two published OpenAPI 3.0.1 documents served from data.g2.com and wired
      into a Swagger UI at /api/v2/docs/index.html; a third (OpenAPI 3.0.1)
      served at www.g2.com/openai.json for the ChatGPT plugin.
  - id: jsonapi
    conforms: true
    evidence: >-
      197 of 198 response bodies use application/vnd.api+json; data/type/id/
      attributes/relationships resource objects, top-level included[] compound
      documents, fields[<type>] sparse fieldsets, and a JSON:API errors[] envelope.
  - id: oauth2
    conforms: true
    evidence: >-
      G2OAuth securityScheme, authorizationCode flow, authorize
      https://www.g2.com/oauth/authorize, token https://www.g2.com/oauth/token,
      revocation and introspection endpoints published.
  - id: oauth2-pkce
    conforms: true
