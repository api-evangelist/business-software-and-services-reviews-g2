description: >-
  G2 ships NO first-party client library for the G2 API in any language. Its
  documentation never mentions an SDK; the only integration paths it publishes
  are raw HTTP, the Swagger UI console, Postman (configured by hand against the
  OAuth endpoints), and the remote MCP server. The packages G2 does publish are
  internal web-platform tooling, not API clients, and the one Ruby API wrapper
  that ever existed was never released to RubyGems and has not been touched
  since 2019. Because there is no official SDK, no `SDKs` pointer is emitted for
  this provider.
