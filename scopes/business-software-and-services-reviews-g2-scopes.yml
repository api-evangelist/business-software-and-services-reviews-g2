  - scope: ds_reviews.read
    description: >-
      Read Data Solutions reviews — the flat, firmographically enriched review
      projection. Required by getDataSolutionsReviews.
    origin: [protected-resource, openapi-operations]
  - scope: g2_activate.read
    description: >-
      Read G2 Activate company unlock data. Required by the four G2 Activate
      operations; a 403 titled "Missing g2_activate.read scope" is declared.
    origin: [protected-resource, openapi-operations]
  - scope: performance_analytics.read
    description: >-
      Read Performance Analytics data. Required by the five Performance Analytics
