docs: https://documentation.g2.com/docs/g2-mcp-server
description: >-
  G2's OAuth 2.0 scope surface, reconciled across three sources that do not
  agree. The OpenAPI securityScheme declares only six scopes in its flows map but
  requires ten distinct scopes at the operation level; the MCP documentation
  publishes an eight-row table; the MCP protected-resource metadata advertises
  ten. The union is sixteen. `origin` on each entry records which sources name
  it, because a scope declared in only one place is a scope a client may not be
  able to request.
authorization_server: https://www.g2.com/
discovery: well-known/business-software-and-services-reviews-g2-openid-configuration.json
registration:
  url: https://my.g2.com/developers
  dynamic_client_registration: false
  note: >-
    OAuth apps must be pre-registered in the G2 Developer Portal. Permissions are
    selected per endpoint at registration; a scope requested in the flow must have
    a matching Read permission enabled on the app or the authorization server
    returns "requested scope is invalid, unknown, or malformed".
schemes:
  - name: G2OAuth
    type: oauth2
    flows:
      - flow: authorizationCode
        authorizationUrl: https://www.g2.com/oauth/authorize
        tokenUrl: https://www.g2.com/oauth/token
        pkce: true
        pkce_methods: [S256, plain]
    sources:
      - openapi/business-software-and-services-reviews-g2-v2-openapi.yml
      - openapi/business-software-and-services-reviews-g2-data-solutions-openapi.yml
  - name: AccountAPIToken
    type: http
    scheme: bearer
    note: >-
      Non-OAuth path. Developer Portal access tokens carry per-endpoint
      permissions rather than scopes, and expire one year after creation. One
      operation (getGridReports) declares a scope-shaped requirement
      "reports.read" against this bearer scheme rather than against G2OAuth.
scope_count: 16
scopes:
  - scope: openid
    description: OpenID Connect default scope. Required for OAuth authentication.
    origin: [openapi-flows, mcp-docs, protected-resource, oidc-discovery]
  - scope: profile
