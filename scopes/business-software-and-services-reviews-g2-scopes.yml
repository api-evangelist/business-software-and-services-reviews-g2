oidc_scopes_supported:
  scopes:
    - openid
    - openid_admin
    - profile
    - profile_admin
  note: >-
    The OIDC discovery document at www.g2.com advertises only these four. The
    API and MCP scopes above are not listed there, so scopes_supported in
    discovery is not a usable inventory of G2's API authorization surface.
inconsistencies:
  - >-
    The OpenAPI flows map declares 6 scopes; operations require 10; the union
    across all published sources is 16. No single G2 document lists them all.
  - >-
    data_subscriptions.write and snippets are required by operations but appear
    in no flows map and no documentation.
  - >-
    performance_analytics.read and the data_subscriptions family appear in the
    spec but not in the MCP protected-resource metadata, so they are presumably
    unavailable to MCP clients.
  - >-
    getGridReports attaches "reports.read" to the AccountAPIToken bearer scheme,
    which has no scope model at all.
